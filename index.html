      (function() {

        var ogImg = document.querySelector('meta[property="og:image"]');
        var ogSec = document.querySelector('meta[property="og:image:secure_url"]');
        var twImg = document.querySelector('meta[name="twitter:image"]');
        var fullUrl = origin + '/images/logo.png?v=20261018';
        if (ogImg) ogImg.setAttribute('content', fullUrl);
        if (ogSec) ogSec.setAttribute('content', fullUrl);
        if (twImg) twImg.setAttribute('content', fullUrl);
      })();
    </script>
